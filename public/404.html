<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Roy Eyal</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Deliberately standalone: inline CSS, no JS, no build step, no
      webfonts. This page has to render when something has already gone
      wrong, so it depends on nothing that could also be missing.

      That's also why it uses the system mono stack instead of Departure
      Mono — the real font lives in src/assets and Vite gives it a hashed
      filename at build time, which this static file in public/ cannot
      know. A terminal voice survives the substitution fine.

      The logo is the ONE exception, and it is safe: public/ is copied
      into dist/ verbatim, so /images/royeyal-logo.svg is a stable path
      that no build step can rename. It is masked rather than inlined so
      the cyan-to-magenta gradient comes from CSS, exactly as .ansi-logo
      does in sections.css.

      The copy is deliberately deadpan — a real shell transcript, no
      joke. Note it never claims the page "never existed": old
      royeyal.studio links may well land here once that site is retired,
      and telling someone their link was never real would be both wrong
      and unhelpful.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
      }

      body {
        min-height: 100svh;
        display: grid;
        align-content: center;
        /* justify-content centers the content COLUMN (which is sized to
           max-content), while justify-items keeps each item left-aligned
           inside it. Terminal output reads as left-aligned text, so
           centering the text itself would look wrong — it's the block
           that wants centering, not the lines. */
        justify-content: center;
        justify-items: start;
        gap: 1.35rem;
        padding: 2rem clamp(1.5rem, 6vw, 4rem);
        background: #05060a;
        color: #f2f4fb;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: clamp(0.8rem, 2.6vw, 0.95rem);
        line-height: 1.7;
        background-image: radial-gradient(
          46rem 28rem at 50% 0%,
          rgba(249, 0, 185, 0.14),
          transparent 64%
        );
      }

      .logo {
        width: min(19rem, 62vw);
        max-width: 100%;
        aspect-ratio: 596 / 117;
        background: linear-gradient(100deg, #42effe 10%, #f900b9 85%);
        -webkit-mask: url('/images/royeyal-logo.svg') 0 0 / contain no-repeat;
        mask: url('/images/royeyal-logo.svg') 0 0 / contain no-repeat;
        filter: drop-shadow(0 0 1.25rem rgba(66, 239, 254, 0.35))
          drop-shadow(0 0.5rem 2.5rem rgba(249, 0, 185, 0.25));
        margin-bottom: 0.5rem;
      }

      /* The transcript carries the whole story, `exit` included. An
         earlier version set `exit` beside the big 404 on a shared
         baseline, which read as a typographic accident — a 13px word
         stranded against a 5rem number. Keeping `exit` at transcript
         size and letting 404 stand alone as the result fixes it. */
      .term {
        display: grid;
        gap: 0.15rem;
        max-width: 100%;
      }

      .prompt {
        color: #42effe;
      }

      .err {
        color: #9aa3b8;
      }

      .code {
        font-size: clamp(3rem, 12vw, 5.5rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #f900b9;
        text-shadow:
          0 0 1.5rem rgba(249, 0, 185, 0.35),
          0 0 5rem rgba(249, 0, 185, 0.35);
      }

      .cursor {
        color: #42effe;
        animation: blink 1.1s steps(1) infinite;
      }

      .note {
        color: #9aa3b8;
        max-width: 44ch;
      }

      /* Matches .btn--primary in base.css — same gradient, radius,
         border and shadow stack, and the same lift on hover. This is the
         only action on the page, so it should read as the loudest
         control, exactly like the hero CTA. */
      a {
        justify-self: start;
        margin-top: 0.6rem;
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        padding: 0.875rem 1.625rem;
        border-radius: 0.625rem;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: linear-gradient(135deg, #f900b9, #a000f0);
        color: #fff;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 0.1875rem 0.5rem rgba(0, 0, 0, 0.7),
          0 0.75rem 1.5rem -0.375rem rgba(0, 0, 0, 0.8),
          0 1.25rem 3.5rem -0.5rem rgba(249, 0, 185, 0.35);
        transition:
          transform 150ms cubic-bezier(0.22, 0.61, 0.36, 1),
          box-shadow 320ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      a:hover,
      a:focus-visible {
        transform: translateY(-0.125rem);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 0.25rem 0.625rem rgba(0, 0, 0, 0.6),
          0 1rem 3rem -0.5rem rgba(249, 0, 185, 0.35),
          0 0 2.5rem -0.25rem rgba(249, 0, 185, 0.35);
      }

      :focus-visible {
        outline: 2px solid #42effe;
        outline-offset: 3px;
      }

      /* Visually hidden, still announced — the visible transcript reads
         as flavour to a screen reader, so the page needs a plain heading
         that states what actually happened. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo" role="img" aria-label="ROY EYAL"></div>

    <h1 class="sr-only">404 — page not found</h1>

    <div class="term">
      <p><span class="prompt">royeyal.com:~$</span> ls ./not-found</p>
      <p class="err">ls: no such file or directory</p>
      <p><span class="prompt">royeyal.com:~$</span> exit</p>
    </div>

    <p>
      <span class="code">404</span
      ><span class="cursor" aria-hidden="true">_</span>
    </p>

    <p class="note">Everything lives at the root.</p>

    <a href="/">Back to the homepage</a>
  </body>
</html>
