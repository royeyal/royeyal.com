<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Roy Eyal</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Deliberately standalone: inline CSS, no JS, no build step, no
      webfonts. This page has to render when something has already gone
      wrong, so it depends on nothing that could also be missing.

      That's also why it uses the system mono stack instead of Departure
      Mono — the real font lives in src/assets and Vite gives it a hashed
      filename at build time, which this static file in public/ cannot
      know. A terminal voice survives the substitution fine.

      The logo is the ONE exception, and it is safe: public/ is copied
      into dist/ verbatim, so /images/royeyal-logo.svg is a stable path
      that no build step can rename. It is masked rather than inlined so
      the cyan-to-magenta gradient comes from CSS, exactly as .ansi-logo
      does in sections.css.

      The copy is deliberately deadpan — a real shell transcript, no
      joke. Note it never claims the page "never existed": old
      royeyal.studio links may well land here once that site is retired,
      and telling someone their link was never real would be both wrong
      and unhelpful.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
      }

      body {
        min-height: 100svh;
        display: grid;
        align-content: center;
        justify-items: start;
        gap: 1.5rem;
        padding: 2rem clamp(1.5rem, 7vw, 6rem);
        background: #05060a;
        color: #f2f4fb;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: clamp(0.8rem, 2.6vw, 0.95rem);
        line-height: 1.7;
        background-image: radial-gradient(
          44rem 26rem at 18% 0%,
          rgba(249, 0, 185, 0.14),
          transparent 62%
        );
      }

      .logo {
        width: min(19rem, 62vw);
        aspect-ratio: 596 / 117;
        background: linear-gradient(100deg, #42effe 10%, #f900b9 85%);
        -webkit-mask: url('/images/royeyal-logo.svg') 0 0 / contain no-repeat;
        mask: url('/images/royeyal-logo.svg') 0 0 / contain no-repeat;
        filter: drop-shadow(0 0 1.25rem rgba(66, 239, 254, 0.35))
          drop-shadow(0 0.5rem 2.5rem rgba(249, 0, 185, 0.25));
        margin-bottom: 0.75rem;
      }

      .term {
        display: grid;
        gap: 0.2rem;
      }

      .prompt {
        color: #42effe;
      }

      .err {
        color: #9aa3b8;
      }

      .exit {
        display: flex;
        align-items: baseline;
        gap: 0.5ch;
        margin-top: 0.5rem;
      }

      .exit-label {
        color: #9aa3b8;
      }

      .code {
        font-size: clamp(2.75rem, 11vw, 5rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #f900b9;
        text-shadow:
          0 0 1.5rem rgba(249, 0, 185, 0.35),
          0 0 5rem rgba(249, 0, 185, 0.35);
      }

      .cursor {
        color: #42effe;
        animation: blink 1.1s steps(1) infinite;
      }

      .note {
        color: #9aa3b8;
        max-width: 44ch;
      }

      a {
        justify-self: start;
        margin-top: 0.75rem;
        padding: 0.8rem 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 0.25rem;
        background: rgba(11, 13, 21, 0.6);
        color: #f2f4fb;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        transition:
          color 190ms cubic-bezier(0.22, 0.61, 0.36, 1),
          border-color 190ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      a:hover,
      a:focus-visible {
        color: #42effe;
        border-color: rgba(66, 239, 254, 0.35);
      }

      :focus-visible {
        outline: 2px solid #42effe;
        outline-offset: 3px;
      }

      /* Visually hidden, still announced — the visible transcript reads
         as flavour to a screen reader, so the page needs a plain heading
         that states what actually happened. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo" role="img" aria-label="ROY EYAL"></div>

    <h1 class="sr-only">404 — page not found</h1>

    <div class="term">
      <p><span class="prompt">royeyal.com:~$</span> ls ./that-page</p>
      <p class="err">ls: no such file or directory</p>
    </div>

    <p class="exit">
      <span class="exit-label">exit</span>
      <span class="code">404</span>
      <span class="cursor" aria-hidden="true">_</span>
    </p>

    <p class="note">Everything lives at the root.</p>

    <a href="/">Back to the homepage</a>
  </body>
</html>
