<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Roy Eyal</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Deliberately standalone: inline CSS, no JS, no build step, no font
      files. This page has to render when something has already gone
      wrong, so it depends on nothing that could also be missing.

      That's also why it uses the system mono stack instead of Departure
      Mono — the real font lives in src/assets and Vite gives it a hashed
      filename at build time, which this static file in public/ cannot
      know. A terminal voice survives the substitution fine.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-content: center;
        gap: 1.75rem;
        padding: 2rem;
        background: #05060a;
        color: #f2f4fb;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.9rem;
        line-height: 1.6;
        background-image: radial-gradient(
          40rem 24rem at 50% 0%,
          rgba(249, 0, 185, 0.13),
          transparent 65%
        );
      }

      .code {
        font-size: clamp(4rem, 18vw, 9rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.04em;
        color: #f900b9;
        text-shadow:
          0 0 1.5rem rgba(249, 0, 185, 0.35),
          0 0 5rem rgba(249, 0, 185, 0.35);
      }

      p {
        max-width: 42ch;
        color: #9aa3b8;
      }

      .prompt {
        color: #42effe;
      }

      a {
        display: inline-block;
        /* Grid items stretch to the column by default, which made the
           button as wide as the widest paragraph. */
        justify-self: start;
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 0.25rem;
        color: #f2f4fb;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        transition:
          color 190ms cubic-bezier(0.22, 0.61, 0.36, 1),
          border-color 190ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      a:hover,
      a:focus-visible {
        color: #42effe;
        border-color: rgba(66, 239, 254, 0.35);
      }

      :focus-visible {
        outline: 2px solid #42effe;
        outline-offset: 3px;
      }

      .blink {
        animation: blink 1.1s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <p class="code">404</p>
    <p>
      <span class="prompt">royeyal.com:~$</span> no such file or directory.<span
        class="blink"
        aria-hidden="true"
        >_</span
      >
    </p>
    <p>
      This site is a single page, so there was probably never anything here.
    </p>
    <a href="/">Back to the CV</a>
  </body>
</html>
