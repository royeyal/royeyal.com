<!doctype html>
<!--
  SOURCE FOR public/og.png — the 1200x630 link-preview card.

  This is not shipped or linked from anywhere; it exists so the OG image
  can be regenerated instead of re-drawn. It reuses the real font files
  and the same masked ANSI wordmark as .ansi-logo in sections.css, so the
  card cannot drift away from the site.

  Design note: this is deliberately sparse — the wordmark and one line.
  An earlier version carried the eyebrow, the full hero tagline and a
  footer row of employers, which read well at full size and turned to
  mush at the ~500px LinkedIn actually renders. A share card is seen
  small; it gets one idea.

  Font and logo paths below are ABSOLUTE on purpose — headless Chrome
  loads this over file://, where relative paths resolve against docs/.
  If the repo moves, update the two paths.

  Regenerate from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --no-sandbox --allow-file-access-from-files \
      --force-device-scale-factor=1 --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=public/og.png \
      "file://$PWD/docs/og-image-source.html"

  Then confirm it really is 1200x630 — a wrong size silently degrades the
  card to a small thumbnail on LinkedIn:

    sips -g pixelWidth -g pixelHeight public/og.png

  --force-device-scale-factor=1 matters: on a retina Mac Chrome otherwise
  renders at 2x and writes a 2400x1260 file.

  If the card's wording changes, update og:image:alt in index.html too —
  the alt text describes this image and will otherwise quietly lie.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Switzer Variable';
        src: url('/Users/royeyal/Documents/GitHub/royeyal.com/src/assets/fonts/Switzer-Variable.woff2')
          format('woff2');
        font-weight: 100 900;
        font-display: block;
      }

      :root {
        --ink: #05060a;
        --magenta: #f900b9;
        --cyan: #42effe;
        --text: #f2f4fb;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: var(--ink);
        font-family: 'Switzer Variable', system-ui, sans-serif;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 58px;
      }

      /* Corner blooms — the same magenta/cyan wash the hero sits in. */
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            58rem 30rem at 8% 4%,
            rgba(66, 239, 254, 0.13),
            transparent 60%
          ),
          radial-gradient(
            54rem 30rem at 94% 104%,
            rgba(249, 0, 185, 0.2),
            transparent 62%
          );
      }

      .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.028) 0 1px,
          transparent 1px 3px
        );
      }

      /* Masked so the gradient comes from CSS — identical treatment to
         .ansi-logo in sections.css. */
      .logo {
        position: relative;
        width: 786px;
        aspect-ratio: 596 / 117;
        background: linear-gradient(100deg, var(--cyan) 8%, var(--magenta) 88%);
        -webkit-mask: url('/Users/royeyal/Documents/GitHub/royeyal.com/public/images/royeyal-logo.svg')
          0 0 / contain no-repeat;
        mask: url('/Users/royeyal/Documents/GitHub/royeyal.com/public/images/royeyal-logo.svg')
          0 0 / contain no-repeat;
        filter: drop-shadow(0 0 28px rgba(66, 239, 254, 0.3))
          drop-shadow(0 14px 52px rgba(249, 0, 185, 0.25));
      }

      .role {
        position: relative;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.015em;
        color: var(--text);
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.8);
      }

      .role .dot {
        color: var(--cyan);
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="scanlines"></div>

    <div class="logo"></div>
    <p class="role">Marketing Web Developer<span class="dot">.</span></p>
  </body>
</html>
